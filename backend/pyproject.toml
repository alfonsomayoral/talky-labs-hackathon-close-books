[project]
name = "closebooks"
version = "0.1.0"
description = "Bank reconciliation pipeline for the Close the Books challenge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "orjson>=3.10",
]

[project.scripts]
closebooks = "closebooks.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/closebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
